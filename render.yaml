services:
  # Backend API
  - type: web
    name: spendguard-api
    env: python
    region: oregon
    plan: free
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr poppler-utils && cd backend && pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Static Site
  - type: static
    name: spendguard-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "echo 'Static site - no build needed'"
    staticPublishPath: ./frontend
